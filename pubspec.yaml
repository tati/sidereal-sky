name: sidereal_sky
description: "Sidereal Sky — daily sky report."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  flutter_html: ^3.0.0-beta.2 # Suggested upgrade as per error message
  win32: ^5.4.0
  chewie: ^1.5.0 # Downgraded to avoid conflict
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  intl: ^0.19.0
  purchases_flutter: ^10.14.0
  purchases_ui_flutter: ^10.14.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/Astrology Signs/
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/images/EBGaramond-VariableFont_wght.ttf
    - family: Maragsa
      fonts:
        - asset: assets/images/Maragsa_Display_400.otf
    - family: LibreBaskerville
      fonts:
        - asset: assets/images/LibreBaskerville-Regular.ttf
        - asset: assets/images/LibreBaskerville-Italic.ttf
          style: italic


